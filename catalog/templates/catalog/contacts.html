{% extends 'catalog/base.html' %}

{% block title %} Контакты {% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Контакты</h1>
</div>
<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Страна</td>
                            <td>USA</td>
                        </tr>
                        <tr>
                            <td class="w-25">ИНН</td>
                            <td>91-1144442</td>
                        </tr>
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>Redmond,WA,98052-6399</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="">
                        {% csrf_token %}

                        <div class="mb-3 text-start">
                            <label for="name">Имя</label>
                            <input type="text" name="name" class="form-control" id="name" required>
                        </div>

                        <div class="mb-3 text-start">
                            <label for="phone">Телефон</label>
                            <input type="tel" name="phone" class="form-control" id="phone" required>
                        </div>

                        <div class="mb-3 text-start">
                            <label for="message">Сообщение</label>
                            <!-- name="email" вместо name="message" -->
                            <textarea name="message" class="form-control" rows="3" id="message" required></textarea>
                        </div>
                        {% if error_message %}
                        <div class="alert alert-danger">{{ error_message }}</div>
                        {% endif %}
                        <button type="submit" class="btn btn-primary">Отправить контакт</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
